name: Merge Conflict Bot

on:
  pull_request_target:
    types: [opened, reopened]
    paths:
      - "task/**"

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create-conflict:
    name: Simulate merge conflict
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR and create conflicting base commit
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            // Only operate on PRs targeting the default branch.
            if (pr.base.ref !== context.payload.repository.default_branch) {
              core.setFailed("Task 3 PRs must target the default branch.");
              return;
            }

            // Require a reference to Issue #1.
            // Do not use closing keywords: the issue must remain open.
            const body = pr.body || "";
            const issuePattern = /\bIssue\s+#1\b/i;

            if (!issuePattern.test(body)) {
              core.setFailed(
                "Your PR description must reference Issue #1."
              );
              return;
            }

            // Find exactly one new Task 3 Markdown submission.
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100
              }
            );

            const submissions = files.filter(file =>
              file.status === "added" &&
              /^task\/[A-Za-z]{3}[0-9]{7}\.md$/.test(file.filename)
            );

            if (submissions.length !== 1) {
              core.setFailed(
                "Submit exactly one new task/XXX2026YYY.md file."
              );
              return;
            }

            const path = submissions[0].filename;
            const rollNumber = path
              .split("/")
              .pop()
              .replace(/\.md$/i, "");

            const baseBranch = pr.base.ref;
            const conflictBranch =
              `bot/task3-conflict-${pr.number}-${context.runId}`;

            // Ensure the submission file does not already exist
            // on the default branch.
            try {
              await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: baseBranch
              });

              core.setFailed(
                "This file already exists on the default branch. " +
                "Use a unique roll-number filename."
              );
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            // Create a branch from the current base because direct writes
            // to the protected default branch are not allowed.
            const baseRef = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `heads/${baseBranch}`
            });

            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/heads/${conflictBranch}`,
              sha: baseRef.data.object.sha
            });

            const botContent = [
              "# Task 3 - Workshop Bot",
              "",
              `**Roll number:** ${rollNumber}`,
              "",
              "## Workshop Bot's Contribution",
              "",
              "The final report must explain how both contributions were integrated.",
              ""
            ].join("\n");

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: `bot(task3): create conflict for ${rollNumber}`,
              content: Buffer.from(botContent).toString("base64"),
              branch: conflictBranch
            });

            const conflictPr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: conflictBranch,
              base: baseBranch,
              title: `bot(task3): create conflict for ${rollNumber}`,
              body:
                `This PR adds the bot's competing version of ${path}.\n\n` +
                "Merge this PR to add the competing base version and create the " +
                "intended add/add conflict with the participant PR."
            });

            // Notify the participant without closing the PR or issue.
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body:
                "🤖 **Task 3 conflict prepared!**\n\n" +
                `I created the bot's competing version of ${path} in ` +
                `${conflictPr.data.html_url}.\n\n` +
                "Merge that pull request to add the competing version to the " +
                "default branch. Then fetch the latest base branch, merge it into " +
                "your branch, resolve the conflict, commit the resolution, and " +
                "push to this same PR.\n\n" +
                "Remember:\n" +
                "- Preserve your original content.\n" +
                "- Incorporate my requested sentence.\n" +
                "- Remove all conflict markers.\n" +
                "- Do not close this PR to bypass the challenge.\n\n" +
                "Good luck! 🔍"
            });

            core.info(`Created conflict PR ${conflictPr.data.html_url} for ${path}.`);
