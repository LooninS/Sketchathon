
name: Merge Conflict Bot

on:
  pull_request_target:
    types: [opened, reopened]
    paths:
      - "task/**"

permissions:
  contents: read
  pull-requests: read
  issues: write



jobs:
  create-conflict:
    name: Simulate merge conflict
    runs-on: ubuntu-latest

    steps:
      # Generate a token belonging to your GitHub App.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.task3_bot_app_id }}
          private-key: ${{ secrets.KEY }}

      - name: Validate PR and create conflicting base commit
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;

            // Only operate on PRs targeting the default branch.
            if (pr.base.ref !== context.payload.repository.default_branch) {
              core.setFailed(
                "Task 3 PRs must target the default branch."
              );
              return;
            }

            // Require a reference to Issue #1.
            // Do not use closing keywords.
            const body = pr.body || "";
            const issuePattern = /\bIssue\s+#1\b/i;

            if (!issuePattern.test(body)) {
              core.setFailed(
                "Your PR description must reference Issue #1."
              );
              return;
            }

            // Find exactly one new Task 3 Markdown submission.
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner,
                repo,
                pull_number: pr.number,
                per_page: 100
              }
            );

            const submissions = files.filter(file =>
              file.status === "added" &&
              /^task\/[A-Za-z]{3}[0-9]{7}\.md$/.test(file.filename)
            );

            if (submissions.length !== 1) {
              core.setFailed(
                "Submit exactly one new task/XXX2026YYY.md file."
              );
              return;
            }

            const path = submissions[0].filename;

            const rollNumber = path
              .split("/")
              .pop()
              .replace(/\.md$/i, "");

            const baseBranch = pr.base.ref;

            // Ensure the file does not already exist on base.
            try {
              await github.rest.repos.getContent({
                owner,
                repo,
                path,
                ref: baseBranch
              });

              core.setFailed(
                "This file already exists on the default branch. " +
                "Use a unique roll-number filename."
              );
              return;

            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            // Competing version created by the bot.
            const botContent = [
              "# Task 3 - Workshop Bot",
              "",
              `**Roll number:** ${rollNumber}`,
              "",
              "## Workshop Bot's Contribution",
              "",
              "The final report must explain how both contributions were integrated.",
              ""
            ].join("\n");

            // Commit directly to the protected base branch.
            // The GitHub App is authorized to bypass the ruleset.
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              message: `bot(task3): create conflict for ${rollNumber}`,
              content: Buffer.from(botContent).toString("base64"),
              branch: baseBranch
            });

            // Notify the participant.
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr.number,
              body:
                "🤖 **Task 3 conflict created!**\n\n" +
                `I added a competing version of \`${path}\` to ` +
                `\`${baseBranch}\`.\n\n` +
                "**Your required addition:**\n\n" +
                "> The final report must explain how both contributions were integrated.\n\n" +
                "Fetch the latest base branch, merge it into your branch, " +
                "resolve the conflict, commit the resolution, and push " +
                "to this same PR.\n\n" +
                "Remember:\n" +
                "- Preserve your original content.\n" +
                "- Incorporate my requested sentence.\n" +
                "- Remove all conflict markers.\n" +
                "- Do not close this PR to bypass the challenge.\n\n" +
                "Good luck! 🔍"
            });

            core.info(`Created conflict for ${path}`);
